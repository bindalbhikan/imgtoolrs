[package]
name = "image_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
calamine = "0.26"
chrono = "0.4"
csv = "1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
jpeg-encoder = "0.6"
md-5 = "0.10"
ndarray = "0.16"
once_cell = "1"
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
rayon = "1"
regex = "1"
rust_xlsxwriter = "0.79"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# Windows: GPU (DirectML) on, GPU na ho to apne aap CPU par chalta hai
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "directml"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
