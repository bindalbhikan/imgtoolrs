name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      ORT_PREFER_DYNAMIC_LINK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ONNX Runtime NuGet package se (GitHub release me win-x64 zip nahi mila)
      - name: Download ONNX Runtime 1.22.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.22.0/microsoft.ml.onnxruntime.1.22.0.nupkg" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort
          $d = Join-Path $env:GITHUB_WORKSPACE "ort\runtimes\win-x64\native"
          Get-ChildItem $d
          if (-not (Test-Path "$d\onnxruntime.lib")) { throw "onnxruntime.lib not found in $d" }
          "ORT_LIB_LOCATION=$d" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\image_tool.exe dist\
          Copy-Item "$env:ORT_LIB_LOCATION\onnxruntime.dll" dist\
          Copy-Item RUN.bat dist\

      - uses: actions/upload-artifact@v4
        with:
          name: image_tool_rs-windows
          path: dist/*
